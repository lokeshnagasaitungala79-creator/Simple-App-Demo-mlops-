stages:

  load_data:
    cmd: python src/load_data.py
    deps:
      - src/load_data.py
      - src/get_data.py
      - params.yaml
      - data_given/winequality.csv
    outs:
      - data/raw/winequality.csv

  split_data:
    cmd: python src/split_data.py
    deps:
      - src/split_data.py
      - src/get_data.py
      - params.yaml
      - data/raw/winequality.csv
    params:
      - split_data.test_size
    outs:
      - data/processed/train_winequality.csv
      - data/processed/test_winequality.csv